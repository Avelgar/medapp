name: medapp
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  mask_text_input_formatter: ^2.8.0
  http: ^1.1.0
  app_links: ^6.3.0
  sqflite: ^2.3.0
  path: ^1.8.3
  fl_chart: ^0.66.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  image_picker: ^1.0.7
  web_socket_channel: ^3.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0 
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21